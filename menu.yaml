      Warm vanilla cookie base filled with rich, melted milk chocolate,
      served in a tin for the ultimate scoopable indulgence.
    price: 179 # placeholder price — update
    badge: Served warm
    image: assets/menu/scoopable-cookie.webp
    image_alt: A warm vanilla cookie in a round tin, a spoon lifting a scoop of molten milk chocolate
    image_style: cutout
    garnish: assets/menu/garnishes/chocolate.webp
    tint: "#F5E4C3"
    accent: "#8C5512"

  - name: Forbidden Berry
