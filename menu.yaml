# ─────────────────────────────────────────────────────────────────────────────
#  Say Gracé · Secret Menu
#  This is the ONLY file you need to edit to update the menu.
#
#  Tips
#  • Items appear in the order they are listed (numbers are added for you).
#  • Image paths are relative to the site root, without a leading "/"
#    (e.g. assets/menu/my-dessert.webp), or a full https:// URL.
#  • image_style:
#      cutout → a transparent PNG/WebP that floats over the coloured arch
#      photo  → a regular rectangular photo that fills the arch (default)
#  • tint   = the soft colour behind the dessert photo (keep it light)
#    accent = small coloured details (number, tagline, badge) — keep it dark
#             enough to read on a light background.
#  • Leave price, badge, tagline or garnish empty (or delete the line) to hide it.
#  • Wrap words in *asterisks* to show them in italics, e.g. "The *Secret* Menu".
#  • {count} / {Count} is replaced with the number of items ("five" / "Five").
# ─────────────────────────────────────────────────────────────────────────────

currency: "₹"

brand:
  name: Say Gracé
  tagline: Crafted with love, made to indulge.

# Quick full-screen welcome shown when the page opens (tap anywhere to skip).
welcome:
  enabled: true
  eyebrow: Welcome to
  message: Come on in — something sweet is waiting.

hero:
  whisper: psst… you found it
  title: The *Secret* Menu
  intro: "{Count} off-menu indulgences, made for those in the know. Ask for them by name — we'll keep it between us."
  cta: Take a peek
  badge: The secret menu ✦ Say Gracé ✦ Shh, don't tell ✦

# Words that scroll across the ribbon between the intro and the menu.
ribbon:
  - Off the menu
  - Shh… it's a secret
  - Ask for it by name
  - Only at Say Gracé

items:
